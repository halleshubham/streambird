<!doctype html>
<!-- Source of web-app/public/og-image.png (1200x630). Regenerate: see .claude/docs/frontend.md "SEO" (Playwright screenshot of this file). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
    display: flex; align-items: center; padding: 0 80px; position: relative; overflow: hidden;
  }
  .glow { position: absolute; right: -140px; top: -140px; width: 520px; height: 520px; border-radius: 50%; background: rgba(255,255,255,.09); }
  .glow2 { position: absolute; right: 120px; bottom: -220px; width: 420px; height: 420px; border-radius: 50%; background: rgba(255,255,255,.06); }
  .copy { position: relative; z-index: 1; flex: 1; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 800; margin-bottom: 36px; }
  .brand img { width: 64px; height: 64px; }
  h1 { font-size: 84px; line-height: 1.04; font-weight: 800; letter-spacing: -2px; }
  p { margin-top: 28px; font-size: 32px; line-height: 1.35; color: #e9ddff; max-width: 760px; }
  .pills { margin-top: 36px; display: flex; gap: 14px; }
  .pill { background: rgba(255,255,255,.16); border-radius: 999px; padding: 10px 24px; font-size: 26px; font-weight: 700; }
  .live { position: absolute; top: 56px; right: 80px; z-index: 1; background: #d93a3f; border-radius: 999px; padding: 10px 26px; font-size: 26px; font-weight: 800; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="live">LIVE</div>
  <div class="copy">
    <div class="brand"><img src="../public/logo-256.png" alt="" />StreamBird</div>
    <h1>Go live once.<br />Be everywhere.</h1>
    <p>Stream from your browser to YouTube, Facebook and Twitch at the same time.</p>
    <div class="pills"><span class="pill">YouTube</span><span class="pill">Facebook</span><span class="pill">Twitch</span></div>
  </div>
</body>
</html>
