services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "9997:9997"
      # WebRTC/WHIP media (ICE/DTLS/SRTP) is UDP -- it can't be proxied by
      # Traefik like the HTTP ports above, so this needs a real host-level
      # UDP port publish. Coolify's structured "dockerimage" app type has no
      # way to express this (its ports_mappings field is TCP-only), which is
      # why this service is deployed via docker-compose instead.
      - "8189:8189/udp"
    networks:
      - coolify
    labels:
      # Explicit Traefik labels rather than Coolify's docker_compose_domains
      # field: that field silently drops the ":<port>" suffix needed to
      # route two different domains to this one service's two different
      # HTTP ports. A second hostname (api-sbmtx...) also 502'd outright
      # even with hand-written labels -- rather than debug Traefik/ACME
      # state for a brand-new hostname further, route the Control API
      # through the SAME domain (already proven working for WHIP) on a
      # path prefix instead, stripped before reaching MediaMTX.
      - coolify.managed=true
      - traefik.enable=true
      - traefik.http.routers.mtx-api.rule=Host(`whip-sbmtx.103.160.107.190.sslip.io`) && PathPrefix(`/__mtxapi__`)
      - traefik.http.routers.mtx-api.entrypoints=https
      - traefik.http.routers.mtx-api.tls=true
      - traefik.http.routers.mtx-api.tls.certresolver=letsencrypt
      - traefik.http.routers.mtx-api.priority=10
      - traefik.http.routers.mtx-api.middlewares=mtx-api-strip
      - traefik.http.middlewares.mtx-api-strip.stripprefix.prefixes=/__mtxapi__
      - traefik.http.routers.mtx-api.service=mtx-api-svc
      - traefik.http.services.mtx-api-svc.loadbalancer.server.port=9997
      - traefik.http.routers.mtx-whip.rule=Host(`whip-sbmtx.103.160.107.190.sslip.io`)
      - traefik.http.routers.mtx-whip.entrypoints=https
      - traefik.http.routers.mtx-whip.tls=true
      - traefik.http.routers.mtx-whip.tls.certresolver=letsencrypt
      - traefik.http.routers.mtx-whip.priority=1
      - traefik.http.routers.mtx-whip.service=mtx-whip-svc
      - traefik.http.services.mtx-whip-svc.loadbalancer.server.port=8889

networks:
  coolify:
    external: true
