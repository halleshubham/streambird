services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "9997:9997"
      # WebRTC/WHIP media (ICE/DTLS/SRTP) is UDP -- it can't be proxied by
      # Traefik like the HTTP ports above, so this needs a real host-level
      # UDP port publish. Coolify's structured "dockerimage" app type has no
      # way to express this (its ports_mappings field is TCP-only), which is
      # why this service is deployed via docker-compose instead.
      - "8189:8189/udp"
    volumes:
      # Coolify's file-storage feature only auto-mounts into a
      # Coolify-*generated* compose file -- it doesn't inject a volume into
      # a raw compose file supplied from git like this one, so without this
      # the container silently falls back to the image's baked-in default
      # config (api: no by default, which is exactly what was observed:
      # every other listener started, but never "[API] started ... :9997").
      # Bind-mounting the exact host path Coolify's file-storage API wrote
      # the config to keeps the real content (incl. the API password) out
      # of git, same as before.
      - /data/coolify/applications/ke9ra2k9ovcjancgamo3bdfv/mediamtx.yml:/mediamtx.yml:ro
      # The mediamtx image's minimal base has no CA trust store, so its own
      # outbound RTMPS forward to Cloudflare failed on every attempt with
      # "x509: certificate signed by unknown authority" -- mount the host's
      # own (real, current) CA bundle at the path Go's TLS stack checks.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - coolify
    labels:
      # Explicit Traefik labels rather than Coolify's docker_compose_domains
      # field: that field silently drops the ":<port>" suffix needed to
      # route two different domains to this one service's two different
      # HTTP ports. An earlier attempt at a second hostname for the API
      # 502'd, which looked like a routing problem but was actually the
      # API server not running at all yet (see the volumes comment above);
      # a same-domain path-prefix workaround hit its own StripPrefix/
      # redirect quirks in MediaMTX's own trailing-slash handling. Now that
      # the API genuinely starts, two clean separate hostnames -- one router
      # each, no path games -- is the simplest correct answer.
      - coolify.managed=true
      - traefik.enable=true
      - traefik.http.routers.mtx-whip.rule=Host(`mtx1.103.160.107.190.sslip.io`)
      - traefik.http.routers.mtx-whip.entrypoints=https
      - traefik.http.routers.mtx-whip.tls=true
      - traefik.http.routers.mtx-whip.tls.certresolver=letsencrypt
      - traefik.http.routers.mtx-whip.service=mtx-whip-svc
      - traefik.http.services.mtx-whip-svc.loadbalancer.server.port=8889
      - traefik.http.routers.mtx-api.rule=Host(`mtx2.103.160.107.190.sslip.io`)
      - traefik.http.routers.mtx-api.entrypoints=https
      - traefik.http.routers.mtx-api.tls=true
      - traefik.http.routers.mtx-api.tls.certresolver=letsencrypt
      - traefik.http.routers.mtx-api.service=mtx-api-svc
      - traefik.http.services.mtx-api-svc.loadbalancer.server.port=9997

networks:
  coolify:
    external: true
