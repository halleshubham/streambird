services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "9997:9997"
      # WebRTC/WHIP media (ICE/DTLS/SRTP) is UDP -- it can't be proxied by
      # Traefik like the HTTP ports above, so this needs a real host-level
      # UDP port publish. Coolify's structured "dockerimage" app type has no
      # way to express this (its ports_mappings field is TCP-only), which is
      # why this service is deployed via docker-compose instead.
      - "8189:8189/udp"
    volumes:
      # Coolify's file-storage feature only auto-mounts into a
      # Coolify-*generated* compose file -- it doesn't inject a volume into
      # a raw compose file supplied from git like this one, so without this
      # the container silently falls back to the image's baked-in default
      # config (api: no by default, which is exactly what was observed:
      # every other listener started, but never "[API] started ... :9997").
      # Bind-mounting the exact host path Coolify's file-storage API wrote
      # the config to keeps the real content (incl. the API password) out
      # of git, same as before.
      - /data/coolify/applications/owu27ugzcewyf9yd9eopxjx2/mediamtx.yml:/mediamtx.yml:ro
      # The mediamtx image's minimal base has no CA trust store, so its own
      # outbound RTMPS forward to Cloudflare failed on every attempt with
      # "x509: certificate signed by unknown authority". Binding this path
      # directly to a raw HOST path (as before) backfired: Coolify's compose
      # scanner auto-detects any bind-mount source that looks like an
      # absolute path and pre-creates it -- since nothing existed at
      # /etc/ssl/certs/ca-certificates.crt on this SM-L4 host's *Docker
      # bind-mount source* location, it silently created an empty
      # *directory* there, giving "read /etc/ssl/certs/ca-certificates.crt:
      # is a directory" on every forward attempt. Fixed the same way as
      # mediamtx.yml below: a real file uploaded through Coolify's
      # file-storage API (curl.se's CA bundle), mounted from its actual
      # managed path instead of guessing at a host path.
      - /data/coolify/applications/owu27ugzcewyf9yd9eopxjx2/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - coolify
    labels:
      # Two Coolify *Applications* (even on the same server, even with
      # connect_to_docker_network on both) don't reliably resolve each
      # other by container name -- confirmed live, twice, on two different
      # servers ("getaddrinfo ENOTFOUND"). Real internal service discovery
      # only works for containers defined together inside one Coolify
      # *Service*'s own compose file (a different resource type -- see e.g.
      # the "forms" service, where opnform-api reaches "redis"/"postgresql"
      # directly because they're one compose project). Restructuring this
      # deployment as part of such a Service would mean moving the backend
      # off its current GHCR-image Application model -- out of scope here,
      # so the Control API is public instead, secured by MediaMTX's own
      # Basic Auth (an api-only authInternalUsers entry, see mediamtx.yml).
      - coolify.managed=true
      - traefik.enable=true
      - traefik.http.routers.mtx-whip.rule=Host(`mediamtx.shackyapps.in`)
      - traefik.http.routers.mtx-whip.entrypoints=https
      - traefik.http.routers.mtx-whip.tls=true
      - traefik.http.routers.mtx-whip.tls.certresolver=letsencrypt
      - traefik.http.routers.mtx-whip.service=mtx-whip-svc
      - traefik.http.services.mtx-whip-svc.loadbalancer.server.port=8889
      - traefik.http.routers.mtx-api.rule=Host(`mtx-api.shackyapps.in`)
      - traefik.http.routers.mtx-api.entrypoints=https
      - traefik.http.routers.mtx-api.tls=true
      - traefik.http.routers.mtx-api.tls.certresolver=letsencrypt
      - traefik.http.routers.mtx-api.service=mtx-api-svc
      - traefik.http.services.mtx-api-svc.loadbalancer.server.port=9997

networks:
  coolify:
    external: true
