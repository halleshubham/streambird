name: CI

# Runs on every pull request, and is also called by docker-publish.yml so the
# image is only built and published from a main that passed everything below.
on:
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streambird
          POSTGRES_PASSWORD: streambird
          POSTGRES_DB: streambird_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U streambird"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgres://streambird:streambird@localhost:5432/streambird_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-app/package-lock.json

      - run: npm ci
      - run: npm ci --prefix web-app

      # The slate end-to-end test pushes real RTMP through ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Typecheck (backend, tests and web app)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build backend and web app
        run: |
          npm run build
          npm run build --prefix web-app

      # Real Postgres (migrations applied on top of existing data) + the real app + a mock Razorpay.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:ui

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
